<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc"><title id="title">ZuriBeans logo</title><desc id="desc">ZuriBeans botanical emblem and uppercase ZURIBEANS wordmark without a descriptor.</desc><g transform="translate(4,-17) scale(.95)"><g id="zuribeans-symbol">
