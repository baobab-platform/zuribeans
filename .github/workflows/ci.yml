name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zuribeans
          POSTGRES_PASSWORD: zuribeans_ci
          POSTGRES_DB: zuribeans_ci
        options: >-
          --health-cmd "pg_isready -U zuribeans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
      SUPPLIER_DB_URL: postgres://zuribeans:zuribeans_ci@postgres:5432/zuribeans_ci
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Medusa 2.21.2 Store consumer inventory (static only)
        run: node scripts/verify-medusa-2212-consumer.mjs
      - name: Prepare transient user-level npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      - name: Install exact published BXS dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      # The governed image carries 1.62.1 browsers. Install the exact revisions
      # required by this repository's synchronized 1.63.0 client before any suite.
      - name: Install synchronized Playwright browser revisions
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Prepare Firefox home ownership
        run: chown 0:0 /github/home
      - name: Launch every pinned browser
        run: node scripts/verify-playwright-browsers.mjs
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Run supplier database migrations
        run: pnpm db:migrate
      - name: Unit tests
        run: pnpm test
      - name: Real-browser component stories
        run: pnpm test:storybook
      - name: Build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        run: pnpm build
      - name: End-to-end tests
        id: experience_browser
        env:
          CI: "true"
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        run: pnpm test:e2e
      - name: Landing-page accessibility checks
        env:
          CI: "true"
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        run: pnpm test:e2e:a11y
      - name: Landing-page visual regression checks
        env:
          CI: "true"
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        run: pnpm test:e2e:visual
      - name: Enforce frontend performance budgets
        run: pnpm perf:budget
      - name: Validate architecture declarations
        run: pnpm architecture:validate

      # Candidate generation preserves the failed gate. Pixels are accepted
      # only by a separately reviewed source commit; normal tests never update.
      - name: Capture visual candidates after browser failure
        if: failure() && steps.experience_browser.outcome == 'failure'
        env:
          CI: "true"
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        run: pnpm test:e2e:visual --update-snapshots

      - name: Preserve browser, visual and lab performance receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.7.5
        with:
          name: zuribeans-experience-browser-evidence
          if-no-files-found: error
          path: |
            test-results/
            playwright-report/
            tests/e2e/landing-page.visual.spec.ts-snapshots/

  image:
    name: Build deployable image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker build
          --secret id=npm_token,env=NODE_AUTH_TOKEN
          --build-arg MEDUSA_BACKEND_URL=http://localhost:9000
          --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_build_only
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_ENABLED_MARKETS=zuribeans_ug,zuribeans_za
          --build-arg NEXT_PUBLIC_DEFAULT_MARKET=zuribeans_za
          --tag zuribeans:test .
