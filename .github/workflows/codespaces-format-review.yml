# Temporary review-only formatter report. No ref update or write access.
name: Codespaces Formatter Evidence
on:
  pull_request:
    paths: [.devcontainer/**, scripts/codespaces/**, docs/development/**, .github/workflows/ci.yml, .github/workflows/codespaces-format-review.yml]
permissions:
  contents: read
  packages: read
jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare package read-only scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      - name: Install frozen dependencies and format only modified Codespaces files
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .devcontainer/devcontainer.json scripts/codespaces/*.mjs docs/development/codespaces-registry-access.md .github/workflows/ci.yml
      - name: Emit deterministic base64 source for reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          for f in .devcontainer/devcontainer.json scripts/codespaces/*.mjs docs/development/codespaces-registry-access.md .github/workflows/ci.yml; do
            echo "FORMATTED_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMATTED_END:$f"
          done
