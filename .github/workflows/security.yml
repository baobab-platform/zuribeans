name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # CodeQL upload requires GitHub Advanced Security on private repositories.
  # Set the repository variable CODEQL_ENABLED=true when GHAS is licensed.
  codeql:
    if: github.event.repository.visibility != 'private' || vars.CODEQL_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@498c431ea7eb76eb038975bc49e7087499d30d48 # shared main, verified 2026-08-30
    with:
      languages: '["javascript-typescript"]'

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.2-frontend
      options: --user 0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
