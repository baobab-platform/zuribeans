name: PR 146 reviewed Figma landing-page baselines (one-time)
on:
  push:
    branches: [fix/catalogue-four-across-category-navigation]
    paths:
      - .github/workflows/pr146-reviewed-visual-baselines-once.yml

permissions:
  contents: write
  actions: read

jobs:
  approve-reviewed-visual-baselines:
    if: ${{ github.repository == 'baobab-platform/zuribeans' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/catalogue-four-across-category-navigation
          fetch-depth: 0
      - name: Retrieve independently verified visual evidence from CI run 41334873750
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: baobab-platform/zuribeans
          run-id: 41334873750
          name: zuribeans-experience-browser-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/pr146-reviewed-visuals
      - name: Verify all five reviewed screenshots and copy only those baselines
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pr146-reviewed-visuals
          sha256sum -c <<'VERIFIED_SCREENSHOTS'
          bd9230bed3d6f4e4b2f0b60caf08813b328c3ee479fcce332daea0b6b5cdf7ac  tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-320-chromium-desktop-linux.png
          b681ff4562f9bde00d8b6b6af4e632fb6dbeee3e86e6ff417160dd28f3a22a1f  tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-390-chromium-desktop-linux.png
          2ca7789ac8ef864061aa0cb9773e48cca2f1def07b7cf53cb0baf4e2abe9447a  tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-768-chromium-desktop-linux.png
          f5cacfa8e7ffa5243f58d7239f2255d2d9dbd8bc8e70b050a30dae799eccc4e2  tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-1024-chromium-desktop-linux.png
          acb0c9423f263e0a01271cb890dc60c324f1e8461397292713b51775409d36b9  tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-1440-chromium-desktop-linux.png
          VERIFIED_SCREENSHOTS
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path("tests/e2e/landing-page.visual.spec.ts-snapshots")
          expected = {320: 12123, 390: 11353, 768: 8395, 1024: 7180, 1440: 7184}
          for width, height in expected.items():
              image = root / f"landing-page-{width}-chromium-desktop-linux.png"
              header = image.read_bytes()[:24]
              assert header[:8] == b"\\x89PNG\\r\\n\\x1a\\n", image
              actual_size = struct.unpack(">II", header[16:24])
              assert actual_size == (width, height), (image, actual_size)
              matches = list(pathlib.Path("test-results").rglob(f"landing-page-{width}-actual.png"))
              assert len(matches) == 1, (image, matches)
              assert image.read_bytes() == matches[0].read_bytes(), image
              print(f"Verified {width}x{height} actual == approved candidate")
          PY
          cd "$GITHUB_WORKSPACE"
          for width in 320 390 768 1024 1440; do
            cp "/tmp/pr146-reviewed-visuals/tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-${width}-chromium-desktop-linux.png" \
               "tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-${width}-chromium-desktop-linux.png"
          done
          git add tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-{320,390,768,1024,1440}-chromium-desktop-linux.png
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --name-only
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test(visual): accept five independently reviewed Figma homepage viewports"
          git push origin HEAD:refs/heads/fix/catalogue-four-across-category-navigation
