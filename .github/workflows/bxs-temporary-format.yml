# One-shot read-only formatter snapshot. Removed before final review.
name: BXS temporary Prettier snapshot
on:
  push:
    branches: [feat/bxs-all-six-experience-packages-20261102]
permissions:
  contents: read
jobs:
  format:
    name: Snapshot pinned Prettier output
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - run: npm install --global prettier@3.9.8
      - name: Format changed source and emit a token-free snapshot
        shell: bash
        run: |
          set -eu
          files=(
            "docs/frontend/bxs-six-package-adoption.md"
            "src/app/dev/experience/bxs/page.tsx"
            "src/app/dev/experience/page.tsx"
            "src/lib/experience/bxs-consumer.test.ts"
            "src/lib/experience/bxs-consumer.ts"
            "tests/e2e/bxs-package-adoption.spec.ts"
          )
          prettier --write "${files[@]}"
          for path in "${files[@]}"; do
            echo "BXS_FORMAT_BEGIN $path"
            base64 -w 120 "$path"
            echo "BXS_FORMAT_END $path"
          done
