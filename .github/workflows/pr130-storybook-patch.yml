name: PR130 Persist Verified Storybook Patch
on:
  push:
    branches:
      - feat/figma-make-editorial-estate
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[storybook-patch-complete]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/figma-make-editorial-estate
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Authorize package registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
      - name: Install frozen lock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Patch Storybook security advisory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm add -D -E storybook@10.6.2 @storybook/addon-a11y@10.6.2 @storybook/addon-docs@10.6.2 @storybook/addon-vitest@10.6.2 @storybook/nextjs-vite@10.6.2 eslint-plugin-storybook@10.6.2
          pnpm install --frozen-lockfile
      - name: Format temporary workflow locally for validation
        run: pnpm exec prettier --write .github/workflows/pr130-storybook-patch.yml
      - name: Verify secure and typed application
        run: |
          pnpm audit --audit-level high
          pnpm format:check
          pnpm typecheck
      - name: Persist only package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Storybook dev tooling [storybook-patch-complete]"
            git push origin HEAD:feat/figma-make-editorial-estate
          fi
