name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@ba171629cdec787f2814d281bae8c4a85d3be820 # BXS-05 verified private-registry Foundation increment
    with:
      foundation_ref: "ba171629cdec787f2814d281bae8c4a85d3be820"
      dependency_review_enabled: true
