name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@756892fbdbcf0eb89bf62f720c372bad53748dea # BXS-05 verified private-registry Foundation increment
    with:
      foundation_ref: "756892fbdbcf0eb89bf62f720c372bad53748dea"
      dependency_review_enabled: true
