name: Format PR146 public sourcing parity once
on:
  push:
    branches: [fix/catalogue-four-across-category-navigation]
    paths:
      - .github/workflows/pr146-public-sourcing-format-once.yml

permissions:
  contents: write

jobs:
  format-public-sourcing:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/catalogue-four-across-category-navigation
          fetch-depth: 0
      - name: Run pinned Prettier over only public sourcing changes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/components/marketing/supplier-editorial-hero.tsx
            src/app/sourcing/page.tsx
            src/app/sourcing/become-a-supplier/page.tsx
            src/components/layout/utility-bar.tsx
            tests/e2e/supplier-make-parity.spec.ts
            tests/e2e/supplier.spec.ts
            tests/e2e/responsive.spec.ts
            tests/e2e/site-header.spec.ts
            tests/e2e/sourcing-figma-public.spec.ts
            docs/design/figma-make-public-supplier-pages.md
          )
          npm exec --yes --package=prettier@3.9.8 -- prettier --write "${paths[@]}"
          npm exec --yes --package=prettier@3.9.8 -- prettier --check "${paths[@]}"
          git add -- "${paths[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(public): apply canonical formatting to sourcing prototype parity"
          git push origin HEAD:refs/heads/fix/catalogue-four-across-category-navigation
