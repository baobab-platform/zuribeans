name: PR146 format public CTA contrast audit once
on:
  push:
    branches: [fix/catalogue-four-across-category-navigation]
    paths:
      - .github/workflows/pr146-public-cta-format-once.yml
permissions:
  contents: write
jobs:
  format-public-cta:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/catalogue-four-across-category-navigation
          fetch-depth: 0
      - name: Apply pinned Prettier only to the CTA audit and performance remediation
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/components/ui/button.tsx
            src/components/ui/button.test.tsx
            src/components/marketing/home/trade-pathways.tsx
            src/components/marketing/supplier-editorial-hero.tsx
            src/app/sourcing/page.tsx
            src/app/sourcing/become-a-supplier/page.tsx
            tests/e2e/public-cta-contrast.spec.ts
          )
          npm exec --yes --package=prettier@3.9.8 -- prettier --write "${paths[@]}"
          npm exec --yes --package=prettier@3.9.8 -- prettier --check "${paths[@]}"
          git add -- "${paths[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(a11y): format semantic CTA contrast and CSS budget remediation"
          git push origin HEAD:refs/heads/fix/catalogue-four-across-category-navigation
