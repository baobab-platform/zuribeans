# Temporary read-only formatter preview; remove before merge.
name: Base UI Formatter Preview
on:
  push:
    branches: [feat/zb-base-ui-dialog-button]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print formatted files for review
        shell: bash
        run: |
          for file in src/components/ui/button.tsx src/components/ui/button.test.tsx src/components/ui/dialog.tsx; do
            value="$(pnpm exec prettier "$file" | base64 -w0)"
            echo "BXFORMAT:$file:$value"
          done
