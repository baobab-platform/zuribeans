name: PR 146 static Figma commodity photos (one-time)
on:
  push:
    branches: [fix/catalogue-four-across-category-navigation]
    paths:
      - .github/workflows/pr146-commodity-photos-once.yml

permissions:
  contents: write

jobs:
  capture-commodity-photos:
    if: ${{ github.repository == 'baobab-platform/zuribeans' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/catalogue-four-across-category-navigation
      - name: Freeze the four Figma Make commodity photographs locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/commodities
          base='https://images.unsplash.com/'
          download_photo() {
            local photo="$1" name="$2"
            curl --fail --location --silent --show-error --retry 3 --max-time 40 \
              "${base}${photo}?w=700&h=520&fit=crop&fm=webp&q=78" \
              -o "public/images/commodities/${name}.webp"
            test "$(stat -c %s "public/images/commodities/${name}.webp")" -gt 2000
          }
          download_photo photo-1611854779393-1b2da9d400fe robusta-coffee
          download_photo photo-1495474472287-4d71bcdd2085 arabica-coffee
          download_photo photo-1526948128573-703ee1aeb6fa vanilla-pods
          download_photo photo-1556909212-d5b604d0c90d sesame-seeds
          for photo in public/images/commodities/*.webp; do
            test "$(file --mime-type --brief "$photo")" = image/webp
            echo "$photo"
            sha256sum "$photo"
          done
          git add public/images/commodities/*.webp
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "assets(catalogue): freeze four Figma Make commodity photographs"
          git push origin HEAD:refs/heads/fix/catalogue-four-across-category-navigation
