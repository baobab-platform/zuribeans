name: PR130 Approved Editorial Baselines
on:
  push:
    branches:
      - feat/figma-make-editorial-estate
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  baseline:
    if: "!contains(github.event.head_commit.message, '[baseline-committed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/figma-make-editorial-estate
          persist-credentials: true
      - name: Retrieve reviewed visual candidate artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/baobab-platform/zuribeans/actions/artifacts/12496424851/zip" \
            --output /tmp/pr130-candidates.zip
          unzip -oq /tmp/pr130-candidates.zip -d /tmp/pr130-candidates
          for width in 320 390 768 1024 1440; do
            source="/tmp/pr130-candidates/tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-${width}-chromium-desktop-linux.png"
            test -s "$source"
            cp "$source" tests/e2e/landing-page.visual.spec.ts-snapshots/
          done
      - name: Commit exactly five reviewed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-320-chromium-desktop-linux.png tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-390-chromium-desktop-linux.png tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-768-chromium-desktop-linux.png tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-1024-chromium-desktop-linux.png tests/e2e/landing-page.visual.spec.ts-snapshots/landing-page-1440-chromium-desktop-linux.png
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): refresh reviewed responsive snapshots from CI artifact 12496424851 [baseline-committed]"
            git push origin HEAD:feat/figma-make-editorial-estate
          fi
