# Temporary, read-only helper to resolve the exact published BXS archives.
# Removed before requesting final PR review. Never logs credentials.
name: BXS temporary lockfile resolution
on:
  push:
    branches: [feat/bxs-all-six-experience-packages-20261102]
permissions:
  contents: read
  packages: read
jobs:
  lockfile:
    name: Resolve six published BXS archives
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          registry-url: "https://npm.pkg.github.com"
          scope: "@baobab-platform"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.24.0
      - name: Resolve lockfile with packages-read only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pnpm install --lockfile-only --no-frozen-lockfile
          sha256sum pnpm-lock.yaml
          echo 'BXS_LOCK_BASE64_BEGIN'
          base64 -w 120 pnpm-lock.yaml
          echo 'BXS_LOCK_BASE64_END'
