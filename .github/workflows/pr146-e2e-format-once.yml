name: PR146 one-time E2E test formatting
on:
  push:
    branches: [fix/catalogue-four-across-category-navigation]
    paths:
      - .github/workflows/pr146-e2e-format-once.yml

permissions:
  contents: write

jobs:
  format-e2e:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/catalogue-four-across-category-navigation
      - name: Format the five corrected browser tests with pinned Prettier 3.9.8
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.8 --write \
            tests/e2e/figma-estate.responsive.spec.ts \
            tests/e2e/responsive.spec.ts \
            tests/e2e/supplier-make-parity.spec.ts \
            tests/e2e/supplier.spec.ts \
            tests/e2e/portal-journeys.spec.ts
          git add tests/e2e/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style(e2e): canonical formatting for role-separated journey assertions"
            git push origin HEAD:refs/heads/fix/catalogue-four-across-category-navigation
          fi
