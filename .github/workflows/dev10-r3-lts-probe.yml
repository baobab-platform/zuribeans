# DEV10-R3: disposable CI compatibility probe, not published image / Codespaces evidence.
# The committed Node24/pnpm11 lock is preserved. Candidate lock regeneration is
# confined to this job checkout; adoption requires separate reviewed owner PR.
name: DEV10 R3 Node26 pnpm12 Playwright 165 Compatibility
on:
  pull_request:
    paths: [".github/workflows/dev10-r3-lts-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  candidate:
    name: Node26 pnpm12 BXS build and browser tests
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: zuribeans_ci
          POSTGRES_USER: zuribeans
          POSTGRES_PASSWORD: zuribeans_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zuribeans -d zuribeans_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      SUPPLIER_DB_URL: postgres://zuribeans:zuribeans_ci@localhost:5432/zuribeans_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install pinned npm-registry pnpm 12 candidate and Corepack
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.13.0
          npm install --global --no-audit --no-fund corepack@0.36.0
          test "$(corepack --version)" = 0.36.0
          # Install the candidate from its official npm package in this disposable CI job.
          # npm verifies the registry package integrity; no unreviewed archive hash.
          # Corepack owns the global pnpm shim. Install native pnpm in a
          # dedicated prefix to avoid EEXIST and keep the selection explicit.
          npm install --prefix "$RUNNER_TEMP/pnpm12" --no-audit --no-fund pnpm@12.21.0
          echo "$RUNNER_TEMP/pnpm12/node_modules/.bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/pnpm12/node_modules/.bin/pnpm" --version)" = 12.21.0
          echo COREPACK_ENABLE_NETWORK=0 >> "$GITHUB_ENV"
          echo COREPACK_DEFAULT_TO_LATEST=0 >> "$GITHUB_ENV"
          echo COREPACK_ENABLE_DOWNLOAD_PROMPT=0 >> "$GITHUB_ENV"
      - name: Stage candidate manifests in disposable checkout (not committed)
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const path of ['package.json','frontend/package.json']){
            if(!fs.existsSync(path))continue;
            const p=JSON.parse(fs.readFileSync(path,'utf8'));
            if(path==='package.json')p.packageManager='pnpm@12.21.0';
            if(p.engines)p.engines.node='>=26.13.0 <27';
            if(p.devDependencies?.['@playwright/test'])p.devDependencies['@playwright/test']='1.65.0';
            if(p.devDependencies?.playwright)p.devDependencies.playwright='1.65.0';
            fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          }
          NODE
      - name: Configure private BXS scope with Actions identity (not Codespaces user)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/codespaces/private-npm.mjs
      - name: Regenerate candidate lock then prove frozen reinstallation
        # The user-level npmrc contains only a literal ${GITHUB_TOKEN} lookup.
        # Keep the read-only Actions identity available during *this* install,
        # not merely when the config file is generated.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = 12.21.0
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Validate candidate dependency alignment
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.packageManager!=="pnpm@12.21.0"||p.devDependencies.playwright!=="1.65.0"||p.devDependencies["@playwright/test"]!=="1.65.0")process.exit(1)'
          pnpm exec playwright --version
      - name: Owner source unit, lint, type and production build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        shell: bash
        run: |
          set -euo pipefail
          pnpm run lint
          pnpm run typecheck
          pnpm db:migrate
          pnpm run test
          pnpm run build
      - name: Qualify Playwright 1.65.0 browser executable and live E2E
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_e2e_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ENABLED_MARKETS: zuribeans_ug,zuribeans_za
          NEXT_PUBLIC_DEFAULT_MARKET: zuribeans_za
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec playwright --version)" = 'Version 1.65.0'
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm run test:e2e
