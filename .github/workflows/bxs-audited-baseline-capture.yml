# One-time transfer of the reviewed 320px screenshot from the CI browser
# artifact. The transfer is SHA256 pinned and self-deletes in its commit.
name: Transfer reviewed ZuriBeans narrow visual baseline
on:
  push:
    branches: [feat/bxs-navigation-and-geography]
    paths: [.github/workflows/bxs-audited-baseline-capture.yml]
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    if: ${{ github.repository == 'baobab-platform/zuribeans' && github.ref == 'refs/heads/feat/bxs-navigation-and-geography' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout reviewed PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Transfer checksum-verified 320px reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gh run download 39053668290 --repo baobab-platform/zuribeans --name zuribeans-experience-browser-evidence --dir "$temp"
          root="tests/e2e/landing-page.visual.spec.ts-snapshots"
          file="landing-page-320-chromium-desktop-linux.png"
          test -s "$temp/$root/$file"
          echo "e3b5cdfa3b9fb3dea223314744f649cced30645fbf86c4d31abbfa5af5c38788  $temp/$root/$file" | sha256sum -c -
          cp "$temp/$root/$file" "$root/$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$root/$file"
          git rm -- .github/workflows/bxs-audited-baseline-capture.yml
          git commit -m "test(bxs): pin inspected 320px responsive landing-page reference"
          git push origin HEAD:refs/heads/feat/bxs-navigation-and-geography
