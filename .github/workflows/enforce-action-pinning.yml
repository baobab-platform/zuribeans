name: Enforce Action Pinning
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@f7466cc89a17c0b6e02b5a1e5fce3ce76073a718 # v1.1.0
