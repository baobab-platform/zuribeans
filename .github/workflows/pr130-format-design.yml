name: Format design review test
on:
  push:
    branches:
      - feat/figma-make-editorial-estate
permissions:
  contents: write
  packages: read
jobs:
  format-test:
    if: "!contains(github.event.head_commit.message, '[design-review-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/figma-make-editorial-estate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/public-estate.design-review.spec.ts
      - run: pnpm exec prettier --check tests/e2e/public-estate.design-review.spec.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/public-estate.design-review.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format extended public-estate design checks [design-review-formatted]"
            git push origin HEAD:feat/figma-make-editorial-estate
          fi
