name: Codespaces Registry and Image Contract
on:
  push:
    branches: [main]
    paths: [.devcontainer/**, scripts/codespaces/**, .github/workflows/codespaces-registry.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: node --test scripts/codespaces/*.node.mjs
  ghcr:
    runs-on: ubuntu-26.04
    steps:
      - name: Read-only GHCR authentication (Actions; Codespaces access is separate)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Inspect exact published images
        run: |
          docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371 >/dev/null
          docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213 >/dev/null
