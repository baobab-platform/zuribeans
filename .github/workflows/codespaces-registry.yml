name: Codespaces Registry and Image Contract
on:
  push:
    branches: [main]
    paths: [.devcontainer/**, scripts/codespaces/**, .github/workflows/codespaces-registry.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - run: node --test scripts/codespaces/*.node.mjs
  ghcr:
    runs-on: ubuntu-26.04
    steps:
      - name: Read-only GHCR authentication (Actions; Codespaces access is separate)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Inspect exact published images
        run: |
          docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.5.1-frontend@sha256:388d604293fc6a2046d1abb9c7b80b32e78c6003636b091d1e9c7c827e34766d >/dev/null
          docker buildx imagetools inspect ghcr.io/baobab-platform/baobab-dev:1.5.1-frontend-e2e@sha256:5b4a9ce1ac819a2b125f078fef4b14837b5b65b46527087a2bb8898b4811bb0b >/dev/null
