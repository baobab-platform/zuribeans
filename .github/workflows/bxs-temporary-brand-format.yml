# Temporary read-only formatter snapshot. Deleted immediately after output capture.
name: BXS brand temporary Prettier snapshot
on:
  push:
    branches: [feat/bxs-all-six-experience-packages-20261102]
permissions:
  contents: read
jobs:
  format:
    name: Format identity files with the repository's exact Prettier
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Install pinned public formatter
        run: npm install --global prettier@3.9.8
      - name: Apply pinned formatting and emit reviewed source snapshot
        shell: bash
        run: |
          set -eu
          files=(
            "docs/frontend/bxs-trade-house-identity.md"
            "src/app/about/page.tsx"
            "src/app/help/page.tsx"
            "src/app/trade/page.tsx"
            "src/components/brand/trade-house-signature.tsx"
            "src/lib/brand/identity.test.ts"
            "tests/e2e/trade-house-identity.spec.ts"
          )
          prettier --write "${files[@]}"
          for path in "${files[@]}"; do
            echo "BXS_BRAND_FORMAT_BEGIN $path"
            base64 -w 120 "$path"
            echo "BXS_BRAND_FORMAT_END $path"
          done
