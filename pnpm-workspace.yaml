packages:
  - "."

overrides:
  postcss: 8.5.26
  sharp: 0.35.5
  source-map-js: 1.2.2
  vite: 8.3.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Immutable, publisher-verified Experience registry releases only.
# Fixed-version exceptions are allowed only after independently verified
# GitHub Packages SHA512/export run 39073362603 (2026-10-17).
minimumReleaseAgeExclude:
  - "@baobab-platform/experience-geo-core@0.3.1"
  - "@baobab-platform/experience-tokens@0.3.1"
  - "@baobab-platform/experience-ui@0.3.1"
