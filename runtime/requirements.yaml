schema:
  name: "baobab-platform-digital-estate-runtime-requirements"
  version: "1.0"
application:
  name: "zuribeans"
  entity_id: "ZURIBEANS"
  kind: "b2b-digital-estate"
  container_port: 3000
ownership:
  application: "baobab-platform/zuribeans"
  commerce: "baobab-platform/baobab-trade"
  production_infrastructure: "baobab-platform/infrastructure"
dependencies:
  baobab_trade:
    required: true
    protocol: "HTTPS"
    interface: "Medusa v2 Store API"
health:
  liveness_path: "/api/health"
environment:
  public:
    - "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY"
    - "NEXT_PUBLIC_SITE_URL"
    - "NEXT_PUBLIC_ENABLED_MARKETS"
    - "NEXT_PUBLIC_DEFAULT_MARKET"
  server_only:
    - "MEDUSA_BACKEND_URL"
    - "SUPPLIER_DB_URL"
data:
  estate_owned_postgres:
    purpose: "Supplier registration/qualification lifecycle (see docs/adr/0006). Not a Baobab engine database, not shared with any engine, and not authoritative for anything Trade/ERP/CMS/Control Plane already own."
    migrations: "drizzle-kit, see drizzle/ and package.json db:migrate"
constraints:
  - "The publishable key is storefront-visible; administrative credentials are prohibited."
  - "No Baobab (Trade/ERP/CMS/Control Plane) database may be accessed directly."
  - "The estate-owned Postgres above is the one exception, and only for state this repo alone is authoritative for; it must never duplicate a Baobab engine's domain data."
  - "Cloud resources, DNS, certificates and secret injection belong to baobab-platform/infrastructure."
